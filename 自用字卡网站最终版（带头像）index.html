<style>

<script>
(function() {
// DOM 元素
const messageInput = document.getElementById('messageInput');
const sendButton = document.getElementById('sendButton');

const tabLexicon = document.getElementById('tabLexicon');

const tabBackup = document.getElementById('tabBackup');
const lexiconContent = document.getElementById('lexiconContent');
const imageLexiconContent = document.getElementById('imageLexiconContent');
const frequencyContent = document.getElementById('frequencyContent');
const backupContent = document.getElementById('backupContent');
const lexiconTextarea = document.getElementById('lexiconTextarea');
const lexiconCountSpan = document.getElementById('lexiconCount');
const imageListContainer = document.getElementById('imageListContainer');
const addImageBtn = document.getElementById('addImageBtn');
const addImageInput = document.getElementById('addImageInput');
const frequencySlider = document.getElementById('frequencySlider');
const frequencyValue = document.getElementById('frequencyValue');
const exportFullBtn = document.getElementById('exportFullBtn');
const importFullBtn = document.getElementById('importFullBtn');
const saveChatBtn = document.getElementById('saveChatBtn');
const clearChatBtn = document.getElementById('clearChatBtn');
const clearImagesOnlyBtn = document.getElementById('clearImagesOnlyBtn');
const otherAvatarContainer = document.getElementById('otherAvatarContainer');
const otherAvatarUpload = document.getElementById('otherAvatarUpload');
const otherAvatarImage = document.getElementById('otherAvatarImage');
const otherAvatarPlaceholder = document.getElementById('otherAvatarPlaceholder');
const otherNicknameBtn = document.getElementById('otherNicknameBtn');
const myAvatarContainer = document.getElementById('myAvatarContainer');
const myAvatarUpload = document.getElementById('myAvatarUpload');
const myAvatarImage = document.getElementById('myAvatarImage');
const myAvatarPlaceholder = document.getElementById('myAvatarPlaceholder');
const myNicknameBtn = document.getElementById('myNicknameBtn');
const addCardBtn = document.getElementById('addCardBtn');
const removeCardBtn = document.getElementById('removeCardBtn');

const SELF_ID = 'me';
const OTHER_ID = 'them';
let replyPhrases = [];
let imagePhrases = [];
let messages = [];
let replyDelaySec = 5;
let otherAvatarUrl = '';
let myAvatarUrl = '';
let otherNickname = '秦彻';
let myNickname = '我';
let currentQuote = null;
let emojis = [];

const STORAGE_KEYS = {
  MESSAGES: 'loveTalk_messages',
  OTHER_NICKNAME: 'loveTalk_otherNickname',
  MY_NICKNAME: 'loveTalk_myNickname',
  OTHER_AVATAR: 'loveTalk_otherAvatar',
  MY_AVATAR: 'loveTalk_myAvatar',
  LEXICON: 'loveTalk_lexicon',
  IMAGES: 'loveTalk_images',
  DELAY: 'loveTalk_delay',
  EMOJIS: 'loveTalk_emojis'
};

// 辅助函数
function getCurrentDateTime() {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth() + 1;
  const day = now.getDate();
  const hours = now.getHours().toString().padStart(2,'0');
  const minutes = now.getMinutes().toString().padStart(2,'0');
  return {
    dateStr: `${year}-${month}-${day}`,
    dateDisplay: `${year}年${month}月${day}日`,
    timeStr: `${hours}:${minutes}`,
    fullTimestamp: now.getTime()
  };
}
function formatDateDisplay(dateStr) {
  if (!dateStr) return '';
  const parts = dateStr.split('-');
  if (parts.length === 3) return `${parts[0]}年${parseInt(parts[1])}月${parseInt(parts[2])}日`;
  return dateStr;
}
function generateId() {
  return Date.now() + '-' + Math.random().toString(36).substr(2, 8);
}
function scrollToBottom() {
  requestAnimationFrame(() => messageContainer.scrollTop = messageContainer.scrollHeight);
}
function showEmptyHint() {
  if (!document.getElementById('emptyHint')) {
    const emptyDiv = document.createElement('div');
    emptyDiv.className = 'empty-chat-hint';
    emptyDiv.id = 'emptyHint';
    emptyDiv.textContent = '💬 写下第一句悄悄话';
    messageContainer.appendChild(emptyDiv);
  }
}
function hideEmptyHint() {
  const h = document.getElementById('emptyHint');
  if (h) h.remove();
}
function isStorageSpaceEnough(additionalDataURL = '') {
  try {
    const messagesStr = JSON.stringify(messages);
    let totalSize = messagesStr.length * 2;
    if (additionalDataURL) totalSize += additionalDataURL.length * 0.75;
    const otherEstimate = 1024 * 1024;
    const limit = 5 * 1024 * 1024;
    return (totalSize + otherEstimate) < limit;
  } catch(e) { return true; }
}
async function compressImage(file, maxSizeKB = 300, maxWidth = 500, qualityStart = 0.6) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = (e) => {
      const img = new Image();
      img.src = e.target.result;
      img.onload = () => {
        let width = img.width;
        let height = img.height;
        let quality = qualityStart;
        if (width > maxWidth) {
          height = (height * maxWidth) / width;
          width = maxWidth;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        let compressed = canvas.toDataURL('image/jpeg', quality);
        while (compressed.length > maxSizeKB * 1024 && quality > 0.3) {
          quality -= 0.1;
          compressed = canvas.toDataURL('image/jpeg', quality);
        }
        if (compressed.length > maxSizeKB * 1024) {
          reject(new Error(`压缩后仍超过 ${maxSizeKB}KB`));
        } else {
          resolve(compressed);
        }
      };
      img.onerror = reject;
    };
    reader.onerror = reject;
  });
}
function getRandomWillReply() { return Math.random() < 0.5; }
function getRandomQuoteForReply() {
  if (Math.random() > 0.3) return null;
  for (let i = messages.length-1; i >= 0; i--) {
    if (messages[i].sender === SELF_ID) {
      return { messageId: messages[i].id, text: messages[i].type === 'text' ? messages[i].text : '[图片]', sender: SELF_ID, type: messages[i].type };
    }
  }
  return null;
}

// 核心：创建消息行（优化后的引用逻辑，无弹窗，滑动不触发）
function createMessageRow(msg) {
  const isSelf = msg.sender === SELF_ID;
  const row = document.createElement('div');
  row.className = 'message-row ' + (isSelf ? 'self' : 'opponent');
  row.dataset.msgId = msg.id;
  // 头像
  const avatar = document.createElement('img');
  avatar.className = 'message-avatar';
  if (isSelf) avatar.src = myAvatarUrl || '';
  else avatar.src = otherAvatarUrl || '';
  avatar.alt = '头像';
  if (!avatar.src) avatar.style.backgroundColor = '#e1b2b2';
  // 内容
  let content;
  if (msg.type === 'image') {
    const wrapper = document.createElement('div');
    wrapper.className = 'image-wrapper';
    const img = document.createElement('img');
    img.src = msg.data;
    img.className = 'image-message';
    wrapper.appendChild(img);
    const meta = document.createElement('div'); meta.className = 'message-meta';
    const timeSpan = document.createElement('span'); timeSpan.textContent = msg.time;
    meta.appendChild(timeSpan);
    wrapper.appendChild(meta);
    if (isSelf && msg.read === true) {
      const readTag = document.createElement('div');
      readTag.className = 'read-tag';
      readTag.textContent = '已读';
      wrapper.appendChild(readTag);
    }
    content = wrapper;
  } else {
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if (msg.quote) {
      const quoteDiv = document.createElement('div');
      quoteDiv.className = 'quote-block';
      const quoteText = document.createElement('div');
      quoteText.className = 'quote-text';
      const displayName = msg.quote.sender === SELF_ID ? myNickname : otherNickname;
      quoteText.innerHTML = `${displayName}：${msg.quote.text || '[图片]'}`;
      quoteDiv.appendChild(quoteText);
      bubble.appendChild(quoteDiv);
    }
    const textSpan = document.createElement('span');
    textSpan.textContent = msg.text;
    bubble.appendChild(textSpan);
    const meta = document.createElement('div'); meta.className = 'message-meta';
    const timeSpan = document.createElement('span'); timeSpan.textContent = msg.time;
    meta.appendChild(timeSpan);
    bubble.appendChild(meta);
    if (isSelf && msg.read === true) {
      const readTag = document.createElement('div');
      readTag.className = 'read-tag';
      readTag.textContent = '已读';
      bubble.appendChild(readTag);
    }
    content = bubble;
  }
  if (isSelf) {
    row.appendChild(content);
    row.appendChild(avatar);
  } else {
    row.appendChild(avatar);
    row.appendChild(content);
  }

  // ========== 优化后的引用逻辑：无弹窗，滑动不触发 ==========
  let touchTimer = null;
  let hasMoved = false;
  const directQuote = () => {
    currentQuote = {
      messageId: msg.id,
      text: msg.type === 'text' ? msg.text : '[图片]',
      sender: msg.sender,
      type: msg.type
    };
    quotePreview.innerText = `引用：${currentQuote.text}`;
    quoteBar.style.display = 'flex';
  };
  // 右键直接引用
  row.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    directQuote();
  });
  // 移动端长按，带移动检测
  row.addEventListener('touchstart', (e) => {
    hasMoved = false;
    touchTimer = setTimeout(() => {
      if (!hasMoved) {
        e.preventDefault();
        directQuote();
      }
      touchTimer = null;
    }, 500);
  });
  row.addEventListener('touchmove', () => {
    hasMoved = true;
    if (touchTimer) {
      clearTimeout(touchTimer);
      touchTimer = null;
    }
  });
  row.addEventListener('touchend', () => {
    if (touchTimer) {
      clearTimeout(touchTimer);
      touchTimer = null;
    }
  });
  return row;
}

function _appendMessage(msg, shouldSave = true) {
  hideEmptyHint();
  const lastMsg = messages.length > 0 ? messages[messages.length-1] : null;
  if (lastMsg && lastMsg.date !== msg.date) {
    messageContainer.appendChild(createDateSeparator(formatDateDisplay(msg.date)));
  } else if (messages.length === 0) {
    messageContainer.appendChild(createDateSeparator(formatDateDisplay(msg.date)));
  }
  const row = createMessageRow(msg);
  messageContainer.appendChild(row);
  if (shouldSave) {
    try {
      messages.push(msg);
      localStorage.setItem(STORAGE_KEYS.MESSAGES, JSON.stringify(messages));
      scrollToBottom();
      return true;
    } catch(e) {
      console.error("存储失败", e);
      messages.pop();
      row.remove();
      alert("存储失败，可能空间不足。请使用「仅清空图片消息」或删除图片词条库中的图片。");
      return false;
    }
  }
  scrollToBottom();
  return true;
}

function appendTextMessage(text, sender, shouldSave = true, willReply = null, quote = null) {
  try {
    const id = generateId();
    const { dateStr, timeStr, fullTimestamp } = getCurrentDateTime();
    const isSelf = sender === SELF_ID;
    const msg = { id, type: 'text', text, sender, time: timeStr, date: dateStr, read: isSelf ? true : undefined, timestamp: fullTimestamp };
    if (quote) msg.quote = quote;
    const success = _appendMessage(msg, shouldSave);
    if (!success) return false;
    const finalWillReply = (isSelf && willReply === null) ? getRandomWillReply() : (willReply !== null ? willReply : false);
    return finalWillReply;
  } catch(e) { console.error(e); alert("发送文字失败"); return false; }
}

function appendImageMessage(data, sender, shouldSave = true, willReply = null, quote = null) {
  try {
    const id = generateId();
    const { dateStr, timeStr, fullTimestamp } = getCurrentDateTime();
    const isSelf = sender === SELF_ID;
    const msg = { id, type: 'image', data, sender, time: timeStr, date: dateStr, read: isSelf ? true : undefined, timestamp: fullTimestamp };
    if (quote) msg.quote = quote;
    const success = _appendMessage(msg, shouldSave);
    if (!success) return false;
    const finalWillReply = (isSelf && willReply === null) ? getRandomWillReply() : (willReply !== null ? willReply : false);
    return finalWillReply;
  } catch(e) { console.error(e); alert("发送图片失败"); return false; }
}

async function sendSelfImage(file) {
  if (!file) return;
  try {
    const compressed = await compressImage(file, 300, 500, 0.6);
    if (!isStorageSpaceEnough(compressed)) {
      alert("存储空间不足，请先使用「仅清空图片消息」或删除图片词条库中的图片。");
      return;
    }
    const quote = currentQuote ? { ...currentQuote } : null;
    const willReply = appendImageMessage(compressed, SELF_ID, true, null, quote);
    if (willReply === false) return;
    currentQuote = null;
    quoteBar.style.display = 'none';
    quotePreview.innerText = '';
    scheduleOpponentReplyIfNeeded(willReply);
  } catch (err) {
    alert("图片处理失败: " + (err.message || "请尝试更小的图片"));
  }
  messageInput.focus();
}

async function sendEmoji(emojiDataUrl) {
  if (!emojiDataUrl) return;

    alert("存储空间不足，请先清理一些图片消息或表情库。");
    return;
  }
  const quote = currentQuote ? { ...currentQuote } : null;

  if (willReply === false) return;
  currentQuote = null;
  quoteBar.style.display = 'none';
  quotePreview.innerText = '';
  scheduleOpponentReplyIfNeeded(willReply);
  messageInput.focus();
}

function sendSelfText() {
  const raw = messageInput.value.trim();
  if (raw === '') return;
  const quote = currentQuote ? { ...currentQuote } : null;
  const willReply = appendTextMessage(raw, SELF_ID, true, null, quote);
  messageInput.value = '';
  messageInput.style.height = 'auto';
  currentQuote = null;
  quoteBar.style.display = 'none';
  quotePreview.innerText = '';
  scheduleOpponentReplyIfNeeded(willReply);
  messageInput.focus();
}

function getRandomPhrases() {
  if (!replyPhrases.length) return ['...'];
  const count = Math.floor(Math.random() * 3) + 1;
  const shuffled = [...replyPhrases].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, count);
}
function simulateOpponentReply() {
  const quote = getRandomQuoteForReply();
  const shouldSendImage = imagePhrases.length > 0 && Math.random() < 0.3;
  if (shouldSendImage) {
    const randomImg = imagePhrases[Math.floor(Math.random() * imagePhrases.length)];
    appendImageMessage(randomImg, OTHER_ID, true, null, quote);
  } else {
    const textList = getRandomPhrases();
    let delay = 0;
    textList.forEach((txt, idx) => {
      setTimeout(() => appendTextMessage(txt, OTHER_ID, true, null, quote), delay);
      delay += 600;
    });
  }
}
let opponentTimer = null;
function scheduleOpponentReplyIfNeeded(willReply) {
  if (willReply === true) {
    if (opponentTimer) clearTimeout(opponentTimer);
    opponentTimer = setTimeout(() => {
      simulateOpponentReply();
      opponentTimer = null;
    }, replyDelaySec * 1000);
  }
}

    if (e.target.files[0]) {
      try {
        const compressed = await compressImage(e.target.files[0], 300, 500, 0.6);
        imagePhrases.push(compressed);
        saveImages();
        renderImageList();
      } catch(err) { alert("图片过大，无法加入词条库，请尝试更小的图片。"); }
    }
    addImageInput.value = '';
  });
  lexiconTextarea.addEventListener('input', updateLexiconFromTextarea);
  addCardBtn.addEventListener('click', () => { const c = prompt('新字卡'); if (c && c.trim()) { lexiconTextarea.value += (lexiconTextarea.value.endsWith('\n')?'':'\n') + c.trim(); updateLexiconFromTextarea(); } });
  removeCardBtn.addEventListener('click', () => { const lines = lexiconTextarea.value.split('\n'); for(let i=lines.length-1;i>=0;i--) if(lines[i].trim() && !/^[\s\-\—\=\_]+$/.test(lines[i].trim())) { lines.splice(i,1); break; } lexiconTextarea.value = lines.join('\n'); updateLexiconFromTextarea(); });
  otherAvatarContainer.addEventListener('click', () => otherAvatarUpload.click());
  otherAvatarUpload.addEventListener('change', (e) => { if (e.target.files[0]) { const reader = new FileReader(); reader.onload = (ev) => saveOtherAvatar(ev.target.result); reader.readAsDataURL(e.target.files[0]); } otherAvatarUpload.value = ''; });
  otherNicknameBtn.addEventListener('click', () => { const newName = prompt('对方昵称', otherNickname); if (newName && newName.trim()) saveOtherNickname(newName.trim()); });
  myAvatarContainer.addEventListener('click', () => myAvatarUpload.click());
  myAvatarUpload.addEventListener('change', (e) => { if (e.target.files[0]) { const reader = new FileReader(); reader.onload = (ev) => saveMyAvatar(ev.target.result); reader.readAsDataURL(e.target.files[0]); } myAvatarUpload.value = ''; });
  myNicknameBtn.addEventListener('click', () => { const newName = prompt('我的昵称', myNickname); if (newName && newName.trim()) saveMyNickname(newName.trim()); });
  exportFullBtn.addEventListener('click', exportFullBackup);
  importFullBtn.addEventListener('click', importFullBackup);
  saveChatBtn.addEventListener('click', saveChatToFile);
  clearChatBtn.addEventListener('click', clearAllMessages);
  clearImagesOnlyBtn.addEventListener('click', clearImagesOnly);
  cancelQuoteBtn.addEventListener('click', () => { currentQuote = null; quoteBar.style.display = 'none'; quotePreview.innerText = ''; });
}
function switchTab(activeTab) {
  [tabLexicon, tabImageLexicon, tabFrequency, tabBackup].forEach(t => t.classList.remove('active'));
  activeTab.classList.add('active');
  lexiconContent.style.display = 'none';
  imageLexiconContent.style.display = 'none';
  frequencyContent.style.display = 'none';
  backupContent.style.display = 'none';
  if (activeTab === tabLexicon) lexiconContent.style.display = 'flex';
  else if (activeTab === tabImageLexicon) imageLexiconContent.style.display = 'flex';
  else if (activeTab === tabFrequency) frequencyContent.style.display = 'flex';
  else if (activeTab === tabBackup) backupContent.style.display = 'flex';
}
